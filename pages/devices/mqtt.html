<section id="mqttPage" class="device-page" data-page-id="mqtt">
  <section class="panel control-panel">
    <div class="panel-heading split">
      <div>
        <h2>MQTT 调试</h2>
        <p data-field="deviceSummary">连接 MQTT Broker，发布/订阅主题并解析 JSON 回包。</p>
      </div>
      <span data-field="driverState" class="state-pill">手动 / 轮询</span>
    </div>

    <div class="subsection-heading">
      <h3>快捷发布</h3>
      <span>需先连接 MQTT；也可在下方收发调试区手动发送</span>
    </div>
    <div id="mqttQuickSendGrid" class="preset-row" aria-label="MQTT 快捷发布"></div>

    <div class="mqtt-stats-grid" aria-label="MQTT 消息统计">
      <div class="mqtt-stat">
        <strong id="mqttRxCount">0</strong>
        <span>已接收</span>
      </div>
      <div class="mqtt-stat">
        <strong id="mqttTxCount">0</strong>
        <span>已发送</span>
      </div>
      <div class="mqtt-stat">
        <strong id="mqttSubscribeTopic">—</strong>
        <span>订阅主题</span>
      </div>
    </div>
  </section>

  <section class="panel custom-panel">
    <div class="panel-heading split">
      <div>
        <h2>发布配置</h2>
        <p>覆盖侧栏默认发布主题，设置 QoS 与保留标志。</p>
      </div>
    </div>

    <div class="config-grid compact">
      <label>
        发布主题
        <input id="mqttPublishTopic" type="text" placeholder="留空使用侧栏「发布主题」" />
      </label>
      <label>
        QoS
        <select id="mqttPublishQos">
          <option value="0" selected>0 - 最多一次</option>
          <option value="1">1 - 至少一次</option>
          <option value="2">2 - 仅一次</option>
        </select>
      </label>
      <label>
        保留消息
        <input id="mqttPublishRetain" type="checkbox" />
      </label>
    </div>
  </section>

  <section class="panel custom-panel">
    <div class="panel-heading split">
      <div>
        <h2>调试配置</h2>
        <p>轮询消息、JSON 解析路径与曲线字段。</p>
      </div>
      <div class="panel-actions">
        <button id="resetMqttConfig" class="ghost-button" type="button">恢复默认</button>
        <button id="saveMqttConfig" type="button">保存</button>
      </div>
    </div>

    <div class="config-grid compact">
      <label>
        轮询间隔 (ms)
        <input id="mqttPollIntervalMs" type="number" min="0" step="1" value="0" />
      </label>
      <label>
        轮询格式
        <select id="mqttHeartbeatFormat">
          <option value="json" selected>JSON</option>
          <option value="ascii">ASCII</option>
          <option value="hex">HEX</option>
        </select>
      </label>
      <label>
        曲线字段名
        <input id="mqttFieldName" type="text" value="数值" />
      </label>
      <label>
        曲线单位
        <input id="mqttUnit" type="text" placeholder="可选" />
      </label>
    </div>

    <label class="template-input">
      轮询消息
      <input id="mqttHeartbeatMessage" type="text" value='{"type":"ping"}' />
    </label>

    <label class="template-input">
      JSON 数值路径
      <input id="mqttParserFieldPath" type="text" value="value" placeholder="例如 value 或 data.temp；留空自动找第一个数字" />
    </label>
  </section>
</section>
