<section id="customPage" class="device-page hmi-page" data-page-id="custom">
  <section class="panel hmi-panel" aria-labelledby="hmiTitle">
    <h2 id="hmiTitle" class="visually-hidden" data-i18n="hmi.title">画布</h2>
    <div class="hmi-toolbar" role="toolbar" data-i18n-aria-label="hmi.toolbar" aria-label="画布工具栏">
      <button id="hmiSidebar" class="ghost-button hmi-icon-button" type="button" aria-pressed="false" data-i18n-aria-label="hmi.sidebar" data-i18n-title="hmi.sidebar" aria-label="显示侧栏" title="显示侧栏"><svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><rect x="1.5" y="2.5" width="13" height="11" rx="1.5"/><path d="M6 2.5v11"/></svg></button>
      <div class="hmi-segmented" role="group" data-i18n-aria-label="hmi.mode" aria-label="模式">
        <button id="hmiModeDesign" type="button" aria-pressed="true" data-i18n="hmi.mode.design">设计</button>
        <button id="hmiModeRun" type="button" aria-pressed="false" data-i18n="hmi.mode.run">运行</button>
      </div>
      <div class="hmi-toolbar-group">
        <button id="hmiNew" class="ghost-button" type="button" data-design-only data-i18n="hmi.new">新建</button>
        <button id="hmiOpen" class="ghost-button" type="button" data-i18n="hmi.open">打开 .uidp</button>
        <button id="hmiSave" class="ghost-button" type="button" data-i18n="hmi.save">另存 .uidp</button>
        <button id="hmiUndo" class="ghost-button" type="button" data-design-only data-i18n="hmi.undo" data-i18n-title="hmi.undoTitle" title="撤销（⌘/Ctrl+Z）">撤销</button>
        <button id="hmiRedo" class="ghost-button" type="button" data-design-only data-i18n="hmi.redo" data-i18n-title="hmi.redoTitle" title="重做（⇧⌘/Ctrl+Z）">重做</button>
        <button id="hmiExample" class="ghost-button" type="button" data-i18n="hmi.example">示例</button>
        <input id="hmiFile" type="file" accept=".uidp,application/json" hidden />
      </div>
      <button id="hmiTogglePalette" class="ghost-button hmi-icon-button" type="button" data-design-only aria-pressed="true" data-i18n-aria-label="hmi.togglePalette" data-i18n-title="hmi.togglePalette" aria-label="控件栏" title="控件栏"><svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><rect x="1.5" y="2.5" width="13" height="11" rx="1.5"/><path d="M5.5 2.5v11M3 5.5h1M3 8h1"/></svg></button>
      <button id="hmiToggleProps" class="ghost-button hmi-icon-button" type="button" data-design-only aria-pressed="true" data-i18n-aria-label="hmi.toggleProps" data-i18n-title="hmi.toggleProps" aria-label="属性栏" title="属性栏"><svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><rect x="1.5" y="2.5" width="13" height="11" rx="1.5"/><path d="M10.5 2.5v11M12 5.5h1M12 8h1"/></svg></button>
      <button id="hmiAlign" class="ghost-button" type="button" data-design-only aria-haspopup="menu" data-i18n-title="hmi.alignTitle" title="对齐所选控件"><svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="M2 1.5v13"/><rect x="4" y="3" width="9" height="3.5" rx="1"/><rect x="4" y="9.5" width="6" height="3.5" rx="1"/></svg><span data-i18n="hmi.align">对齐</span></button>
      <button id="hmiGrid" class="ghost-button hmi-icon-button" type="button" data-design-only aria-pressed="true" data-i18n-aria-label="hmi.grid" data-i18n-title="hmi.grid" aria-label="网格" title="网格"><svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.3" aria-hidden="true"><rect x="2" y="2" width="12" height="12" rx="1"/><path d="M6 2v12M10 2v12M2 6h12M2 10h12"/></svg></button>
      <div class="hmi-segmented" role="group" data-design-only data-i18n-aria-label="hmi.zoom" aria-label="缩放">
        <button id="hmiZoomOut" type="button" data-i18n-aria-label="hmi.zoomOut" data-i18n-title="hmi.zoomOutTitle" aria-label="缩小" title="缩小（⌘/Ctrl −）">−</button>
        <button id="hmiZoomIn" type="button" data-i18n-aria-label="hmi.zoomIn" data-i18n-title="hmi.zoomInTitle" aria-label="放大" title="放大（⌘/Ctrl +）">+</button>
        <button id="hmiZoomFit" type="button" aria-pressed="true" data-i18n="hmi.zoomFit">适应</button>
        <button id="hmiZoom100" type="button" aria-pressed="false">100%</button>
      </div>
      <span id="hmiStatus" class="hmi-status" role="status"></span>
    </div>
    <p id="hmiNarrowNote" class="hmi-narrow-note" hidden data-i18n="hmi.narrowNote">窄屏只能运行；请在电脑上编辑画布。</p>
    <p id="hmiNoLinkHint" class="hmi-narrow-note" hidden data-i18n="hmi.noLinkHint">放一张串口 / TCP / MQTT 卡片来连接设备。</p>
    <div id="hmiWorkspace" class="hmi-workspace">
      <aside class="hmi-palette" data-design-only data-i18n-aria-label="hmi.palette" aria-label="控件栏">
        <button id="hmiPaletteClose" class="hmi-panel-collapse" type="button" data-i18n-aria-label="hmi.hidePalette" data-i18n-title="hmi.hidePalette" aria-label="隐藏控件栏" title="隐藏控件栏">&#171;</button>
        <div id="hmiPalette"></div>
      </aside>
      <div id="hmiViewport" class="hmi-viewport" tabindex="0" data-i18n-aria-label="hmi.canvas" aria-label="画布">
        <div id="hmiStage" class="hmi-stage"><div id="hmiCanvas" class="hmi-canvas"></div></div>
      </div>
      <aside class="hmi-properties" data-design-only data-i18n-aria-label="hmi.properties" aria-label="属性">
        <button id="hmiPropsClose" class="hmi-panel-collapse" type="button" data-i18n-aria-label="hmi.hideProps" data-i18n-title="hmi.hideProps" aria-label="隐藏属性栏" title="隐藏属性栏">&#187;</button>
        <div id="hmiProperties"></div>
      </aside>
    </div>
    <p id="hmiToast" class="hmi-toast" role="status" aria-live="polite" hidden></p>
  </section>
</section>
