<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="AOMaster 在线串口工作台，面向 4-20mA 与 0-10V 信号发生器的浏览器端通讯框架。"
    />
    <title>AOMaster 串口工作台</title>
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand-block">
          <span class="brand-mark" aria-hidden="true">AO</span>
          <div>
            <h1>AOMaster</h1>
            <p>在线串口工作台</p>
          </div>
        </div>
        <div class="topbar-actions">
          <span id="secureState" class="state-pill">检测环境</span>
          <button id="connectButton" class="primary-button" type="button">
            <span aria-hidden="true">↔</span>
            连接串口
          </button>
          <button id="disconnectButton" class="icon-button" type="button" disabled aria-label="断开串口" title="断开串口">
            ⏻
          </button>
        </div>
      </header>

      <aside class="sidebar" aria-label="设备导航">
        <section class="panel device-panel">
          <div class="panel-heading">
            <h2>设备</h2>
            <span id="connectionState" class="status-dot">未连接</span>
          </div>
          <button class="device-item active" type="button">
            <span class="device-icon" aria-hidden="true">A</span>
            <span>
              <strong>AOMaster</strong>
              <small>4-20mA / 0-10V 输出</small>
            </span>
          </button>
          <button class="device-item upcoming" type="button" disabled>
            <span class="device-icon" aria-hidden="true">+</span>
            <span>
              <strong>更多设备</strong>
              <small>预留驱动接口</small>
            </span>
          </button>
        </section>

        <section class="panel">
          <div class="panel-heading">
            <h2>串口参数</h2>
          </div>
          <label>
            波特率
            <select id="baudRate">
              <option value="9600">9600</option>
              <option value="19200">19200</option>
              <option value="38400">38400</option>
              <option value="57600">57600</option>
              <option value="115200" selected>115200</option>
            </select>
          </label>
          <div class="settings-grid">
            <label>
              数据位
              <select id="dataBits">
                <option value="7">7</option>
                <option value="8" selected>8</option>
              </select>
            </label>
            <label>
              停止位
              <select id="stopBits">
                <option value="1" selected>1</option>
                <option value="2">2</option>
              </select>
            </label>
          </div>
          <label>
            校验
            <select id="parity">
              <option value="none" selected>None</option>
              <option value="even">Even</option>
              <option value="odd">Odd</option>
            </select>
          </label>
          <label>
            流控
            <select id="flowControl">
              <option value="none" selected>None</option>
              <option value="hardware">Hardware</option>
            </select>
          </label>
        </section>
      </aside>

      <main class="workspace">
        <section class="panel control-panel">
          <div class="panel-heading split">
            <div>
              <h2>AOMaster 输出</h2>
              <p>协议未定时，参数会先记录在页面状态，可通过下方手动命令发送。</p>
            </div>
            <span id="driverState" class="state-pill warning">协议待配置</span>
          </div>

          <div class="mode-row" role="radiogroup" aria-label="输出模式">
            <label class="segmented-option">
              <input type="radio" name="outputMode" value="current" checked />
              <span>4-20mA</span>
            </label>
            <label class="segmented-option">
              <input type="radio" name="outputMode" value="voltage" />
              <span>0-10V</span>
            </label>
          </div>

          <div class="setpoint-row">
            <label class="range-label" for="setpointSlider">
              <span id="setpointLabel">电流设定</span>
              <strong id="setpointReadout">12.000 mA</strong>
            </label>
            <input id="setpointSlider" type="range" min="4" max="20" step="0.001" value="12" />
            <div class="numeric-entry">
              <input id="setpointInput" type="number" min="4" max="20" step="0.001" value="12.000" />
              <span id="setpointUnit">mA</span>
            </div>
          </div>

          <div class="preset-row" aria-label="快速设定">
            <button type="button" data-preset="min">最小</button>
            <button type="button" data-preset="mid">中点</button>
            <button type="button" data-preset="max">最大</button>
          </div>

          <div class="command-preview">
            <div>
              <span>驱动命令预览</span>
              <code id="protocolPreview">等待协议定义</code>
            </div>
            <button id="sendDriverCommand" type="button" disabled>发送设定</button>
          </div>
        </section>

        <section class="panel chart-panel">
          <div class="panel-heading split">
            <div>
              <h2>曲线查看</h2>
              <p>自动尝试从接收文本中提取数值；协议确定后可切换为设备字段。</p>
            </div>
            <button id="clearChart" class="icon-button" type="button" aria-label="清空曲线" title="清空曲线">⌫</button>
          </div>
          <canvas id="telemetryChart" width="960" height="320" aria-label="实时曲线"></canvas>
          <div class="chart-meta">
            <span id="chartValue">暂无数据</span>
            <span>最近 120 个采样点</span>
          </div>
        </section>

        <section class="panel console-panel">
          <div class="panel-heading split">
            <div>
              <h2>串口收发</h2>
              <p>支持 ASCII 与 HEX，适合在 AOMaster 协议确认前做调试。</p>
            </div>
            <button id="clearLog" class="icon-button" type="button" aria-label="清空日志" title="清空日志">⌧</button>
          </div>

          <div id="serialLog" class="serial-log" aria-live="polite"></div>

          <div class="send-grid">
            <label>
              格式
              <select id="sendFormat">
                <option value="ascii" selected>ASCII</option>
                <option value="hex">HEX</option>
              </select>
            </label>
            <label>
              行尾
              <select id="lineEnding">
                <option value="">无</option>
                <option value="\n">LF</option>
                <option value="\r\n" selected>CRLF</option>
              </select>
            </label>
            <label class="send-command">
              命令
              <input id="manualCommand" type="text" placeholder="例如：READ? 或 01 03 00 00" />
            </label>
            <button id="sendManual" type="button" disabled>发送</button>
          </div>
        </section>
      </main>
    </div>

    <script type="module" src="./src/app.js"></script>
  </body>
</html>
